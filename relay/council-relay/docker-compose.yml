services:
  council-relay:
    build: .
    image: council-relay:local
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8787:8787"
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
